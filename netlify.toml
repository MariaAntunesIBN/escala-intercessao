[build]
  publish = "public"
  functions = "netlify/functions"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Cabeçalhos gerais de segurança
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# HTML/JS/CSS do app nunca ficam em cache do navegador (evita HTML novo + JS antigo).
# O funcionamento offline é garantido pelo Service Worker.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/shared.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/mobile.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Página de limpeza total: usada manualmente quando um aparelho fica preso em versão antiga.
# O cabeçalho Clear-Site-Data apaga cache e dados do site no navegador (inclusive o Service Worker).
[[headers]]
  for = "/reset.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    Clear-Site-Data = "\"cache\", \"storage\""
