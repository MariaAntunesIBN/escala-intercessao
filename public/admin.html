<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#31859c">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Escala">
<meta name="robots" content="noindex"><title>Administração – Escala</title>
<script src="/vendor/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1b2430;--mu:#5d6b7a;--bd:#d6dde5;--pr:#31859c;--rd:#d32f2f;--sun:#e8f0fa}
@media (prefers-color-scheme:dark){:root{--bg:#12171d;--card:#1b232c;--tx:#e8edf2;--mu:#9aa8b6;--bd:#2f3b47;--sun:#223246}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif}
.w{max-width:900px;margin:0 auto;padding:16px}h1{font-size:20px;color:var(--pr);margin:0}h2{font-size:16px;margin:0 0 10px}
header{display:flex;align-items:center;gap:14px;margin-bottom:14px}header img{height:56px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px;flex:1;min-width:150px}
input,select,button{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
button{cursor:pointer;background:var(--pr);color:#fff;border-color:var(--pr)}
button.s{background:var(--card);color:var(--tx);border-color:var(--bd)}button.d{background:var(--card);color:var(--rd);border-color:var(--rd)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}
th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{background:var(--pr);color:#fff;font-size:13px}
tr.dom td{background:var(--sun)}tr.hoje td{font-weight:700;outline:2px solid var(--pr);outline-offset:-2px}tr.off td:not(:last-child){opacity:.5}
td select{width:100%;min-width:170px}.act{display:flex;gap:6px}.act button{padding:5px 9px;font-size:13px}
.msg{color:var(--mu);font-size:13px;min-height:18px;margin-top:8px}.err{color:var(--rd)}a{color:var(--pr)}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{background:var(--card);color:var(--tx);border-color:var(--bd)}.tabs button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
</style><style>#login{max-width:340px;margin:12vh auto}</style><link rel="stylesheet" href="/mobile.css"></head><body><div class="w">
<div id="login" class="card" hidden><h1>Administração</h1><label style="margin-top:10px">Senha de acesso<input id="pw" type="password" autocomplete="current-password"></label>
<div class="row" style="margin-top:10px"><button id="entrar">Entrar</button><a href="/">Ver escala</a></div><div class="msg err" id="lmsg"></div></div>

<div id="app" hidden>
<div class="row" style="justify-content:space-between;margin-bottom:12px"><h1>Administração</h1><span><a href="/">Ver página pública</a> <button class="s" id="sair">Sair</button></span></div>
<div class="tabs"><button id="t1" class="on">Escala</button><button id="t2">Servos</button></div>

<div id="p1"><div class="card"><div class="row"><label>Mês<select id="mes"></select></label><label>Ano<input id="ano" type="number" min="2020" max="2100"></label>
<button class="s" id="rod">Preencher em rodízio</button><button class="s" id="lim">Limpar</button></div></div>
<div class="card"><div class="tw"><table><thead><tr><th>Dia</th><th>Data</th><th>Início</th><th>Término</th><th>Servos</th></tr></thead><tbody id="tb"></tbody></table></div>
<div class="row" style="margin-top:12px"><button id="pub">Salvar e publicar</button><button class="s" id="pdf">Baixar PDF</button><button class="d" id="del">Excluir escala do mês</button></div>
<div class="msg" id="emsg"></div></div></div>

<div id="p2" hidden><div class="card"><div class="row"><label>Nome (ou casal)<input id="nome" placeholder="Ex.: Maria e João"></label>
<label>Celular (WhatsApp)<input id="cel" inputmode="tel" placeholder="(66) 99999-9999"></label>
<button id="salvar">Cadastrar</button><button class="s" id="cancel" hidden>Cancelar edição</button></div><div class="msg err" id="msg"></div></div>
<div class="card"><div class="row" style="margin-bottom:10px"><label>Buscar<input id="q" placeholder="Nome ou telefone"></label>
<label style="max-width:180px;flex:none">Mostrar<select id="f"><option value="ativos">Ativos</option><option value="inativos">Inativos</option><option value="todos">Todos</option></select></label></div>
<div class="tw"><table><thead><tr><th>Nome</th><th>Celular</th><th>Status</th><th></th></tr></thead><tbody id="sb"></tbody></table></div><div class="msg" id="cnt"></div></div></div>
</div></div>
<script src="shared.js"></script>
<script>
const $=id=>document.getElementById(id);let senha=sessionStorage.getItem("senha")||"",servos=[],slots=[],sel=[],edit=null;
const fmt=d=>{d=(d||"").replace(/\D/g,"");if(d.startsWith("55")&&d.length>11)d=d.slice(2);return d.length===11?`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`:d.length===10?`(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`:d};
async function api(url,method="GET",body){const r=await fetch(url,{method,headers:{"x-senha":senha,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
const j=await r.json().catch(()=>({}));if(r.status===401){sair();throw new Error(j.erro||"Senha inválida.")}if(!r.ok)throw new Error(j.erro||"Erro "+r.status);return j}
function sair(){sessionStorage.removeItem("senha");senha="";$("app").hidden=true;$("login").hidden=false}
async function entrar(){servos=await api("/api/servos");$("login").hidden=true;$("app").hidden=false;renderServos();await carregarEscala()}
$("entrar").onclick=async()=>{senha=$("pw").value;$("lmsg").textContent="";try{await entrar();sessionStorage.setItem("senha",senha)}catch(e){$("lmsg").textContent=e.message}};
$("pw").onkeydown=e=>{if(e.key==="Enter")$("entrar").click()};$("sair").onclick=sair;
$("t1").onclick=()=>aba(1);$("t2").onclick=()=>aba(2);
function aba(n){$("p1").hidden=n!==1;$("p2").hidden=n!==2;$("t1").className=n===1?"on":"";$("t2").className=n===2?"on":""}

// ---- Escala
const hoje=new Date();$("mes").innerHTML=MESES.map((m,i)=>`<option value="${i}">${m}</option>`).join("");$("mes").value=hoje.getMonth();$("ano").value=hoje.getFullYear();
const ym=()=>`${$("ano").value}-${pad(+$("mes").value+1)}`;
async function carregarEscala(){const y=+$("ano").value,m=+$("mes").value;if(!y)return;slots=slotsDoMes(y,m);
const saved=(await (await fetch("/api/escala/"+ym())).json())||[],mp={};saved.forEach(l=>mp[l.d+"|"+l.i]=l.nome);
sel=slots.map(s=>mp[s.d+"|"+s.i]||"");renderEscala();$("emsg").textContent=saved.length?"Escala já publicada para este mês.":"Escala ainda não publicada."}
function renderEscala(){const m=+$("mes").value,y=+$("ano").value,tb=$("tb");tb.innerHTML="";const ativos=servos.filter(s=>s.ativo).map(s=>s.nome).sort((a,b)=>a.localeCompare(b,"pt"));
slots.forEach((s,i)=>{const tr=document.createElement("tr");if(s.w===0)tr.className="dom";
const lbs=["Dia","Data","Início","Término"];[DIAS[s.w],`${pad(s.d)}/${pad(m+1)}/${y}`,s.i,s.f].forEach((t,j)=>{const td=document.createElement("td");td.textContent=t;td.dataset.l=lbs[j];tr.append(td)});
const td=document.createElement("td"),se=document.createElement("select");td.dataset.l="Servo";
const op=t=>{const o=document.createElement("option");o.value=t;o.textContent=t||"—";se.append(o)};op("");ativos.forEach(op);
if(sel[i]&&!ativos.includes(sel[i]))op(sel[i]);se.value=sel[i];se.onchange=()=>sel[i]=se.value;td.append(se);tr.append(td);tb.append(tr)})}
$("mes").onchange=carregarEscala;$("ano").onchange=carregarEscala;
$("lim").onclick=()=>{sel=slots.map(()=>"");renderEscala()};
$("rod").onclick=()=>{const o=servos.filter(s=>s.ativo).map(s=>s.nome);if(!o.length)return;sel=slots.map((_,i)=>o[i%o.length]);renderEscala()};
const linhas=()=>slots.map((s,i)=>({...s,nome:sel[i]}));
$("pdf").onclick=()=>gerarPdf(+$("ano").value,+$("mes").value,linhas());
$("pub").onclick=async()=>{try{await api("/api/escala/"+ym(),"PUT",{linhas:linhas()});$("emsg").textContent="Escala publicada na página pública."}catch(e){$("emsg").textContent=e.message}};
$("del").onclick=async()=>{if(!confirm("Remover a escala publicada deste mês?"))return;try{await api("/api/escala/"+ym(),"DELETE");sel=slots.map(()=>"");renderEscala();$("emsg").textContent="Escala removida."}catch(e){$("emsg").textContent=e.message}};

// ---- Servos
function renderServos(){const q=$("q").value.toLowerCase(),f=$("f").value;
const v=servos.filter(s=>(f==="todos"||(f==="ativos")===s.ativo)&&(s.nome.toLowerCase().includes(q)||s.celular.includes(q.replace(/\D/g,"")||"\u0000"))).sort((a,b)=>a.nome.localeCompare(b.nome,"pt"));
const tb=$("sb");tb.innerHTML="";
v.forEach(s=>{const tr=document.createElement("tr");if(!s.ativo)tr.className="off";
const c=(t,n,l)=>{const td=document.createElement("td");if(l)td.dataset.l=l;if(n)td.append(n);else td.textContent=t;tr.append(td)};
c(s.nome,"","Nome");const w=document.createElement("span");
if(s.celular){const a=document.createElement("a");a.href="https://wa.me/"+(s.celular.length<=11?"55":"")+s.celular;a.target="_blank";a.rel="noopener";a.textContent=fmt(s.celular);w.append(a)}else w.textContent="—";c("",w,"Celular");
c(s.ativo?"Ativo":"Inativo","","Status");
const act=document.createElement("div");act.className="act";
const b=(t,cls,fn)=>{const x=document.createElement("button");x.textContent=t;x.className=cls;x.onclick=fn;act.append(x)};
b("Editar","s",()=>{edit=s.id;$("nome").value=s.nome;$("cel").value=fmt(s.celular);$("salvar").textContent="Salvar";$("cancel").hidden=false;$("nome").focus()});
b(s.ativo?"Inativar":"Reativar","s",()=>run(()=>api("/api/servos/"+s.id,"PUT",{ativo:!s.ativo})));
b("Excluir","d",()=>{if(confirm(`Excluir ${s.nome} definitivamente? Para só tirar da escala, use Inativar.`))run(()=>api("/api/servos/"+s.id,"DELETE"))});
c("",act);tb.append(tr)});$("cnt").textContent=v.length+" de "+servos.length+" servos"}
async function run(fn){$("msg").textContent="";try{await fn();servos=await api("/api/servos");renderServos();renderEscala()}catch(e){$("msg").textContent=e.message}}
function limpar(){edit=null;$("nome").value="";$("cel").value="";$("salvar").textContent="Cadastrar";$("cancel").hidden=true}
$("cancel").onclick=limpar;
$("salvar").onclick=()=>run(async()=>{const b={nome:$("nome").value,celular:$("cel").value};if(edit)await api("/api/servos/"+edit,"PUT",b);else await api("/api/servos","POST",b);limpar()});
$("cel").oninput=e=>e.target.value=fmt(e.target.value);$("q").oninput=renderServos;$("f").onchange=renderServos;
if(senha)entrar().catch(()=>sair());else $("login").hidden=false;
</script><script>if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js");</script></body></html>
