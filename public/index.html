<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#31859c">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Escala">
<title>Escala – Ministério de Intercessão</title>
<script src="/vendor/jspdf.umd.min.js"></script>
<style>
/* Estilos Bíblia Holyrics */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:4px;margin-bottom:14px}
.bgrid button{padding:8px 2px;font-size:12px;font-weight:700;border:none;color:#fff;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.bgrid button span{font-size:9px;font-weight:400;opacity:0.9}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:4px}
.cgrid button{background:var(--card);color:var(--tx);border:1px solid var(--bd);padding:10px 0;font-weight:700}
.cgrid button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.vlist p{margin:12px 0;padding-left:35px;position:relative}
.vlist p b{position:absolute;left:0;color:var(--pr);font-size:14px;width:30px;text-align:right}
.b-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--bd)}
.b-nav h2{margin:0;color:var(--pr)}
.cat-0{background:#5d4037 !important} .cat-1{background:#f57c00 !important}
.cat-2{background:#d32f2f !important} .cat-3{background:#7b1fa2 !important}
.cat-4{background:#c2185b !important} .cat-5{background:#1976d2 !important}
.cat-6{background:#0097a7 !important} .cat-7{background:#388e3c !important}
.cat-8{background:#1b5e20 !important} .cat-9{background:#afb42b !important}
</style><link rel="stylesheet" href="/mobile.css"></head><body>
<header class="top"><div class="in"><a class="logo" href="/"><img id="lg" alt="Igreja Batista Nacional de Sorriso"></a><div class="sep"></div><div><h1>Ministério de Intercessão</h1><p>Escala de servos</p></div><a class="adm" href="/admin.html" title="Administração" aria-label="Administração"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></a></div></header>
<div class="w">

<div class="main-content">
  <div class="tabs"><button id="t1" class="on">Escala</button><button id="t2">Bíblia de Estudo</button></div>

  <div id="p1">
    <div class="card"><div class="row"><label>Mês<select id="mes"></select></label><label>Ano<select id="ano"></select></label>
    <button id="pdf" hidden>Baixar PDF</button></div></div>
    <div class="card paper">
      <div class="paper-head"><img id="plg" alt="Igreja Batista Nacional de Sorriso">
        <div><h2>MINISTÉRIO DE INTERCESSÃO</h2><p id="ptitulo"></p></div></div>
      <div class="paper-body">
        <div class="tw"><table><thead><tr><th>Dia</th><th>Servos</th><th>Data</th><th>Início</th><th>Término</th></tr></thead><tbody id="tb"></tbody></table></div>
        <div class="cal" id="cal"></div>
      </div>
      <div class="msg" id="msg"></div>
    </div>
  </div>

  <div id="p2" hidden>
    <div class="card">
      <div class="row">
        <label>Busca por texto ou referência<input id="bq" placeholder="Ex: Joao 3:16 ou Salmos 23"></label>
        <button id="bbuscar">Buscar</button>
        <button class="s" id="brandom">Aleatório</button>
      </div>
    </div>
    
    <div id="bview">
      <div class="card">
        <div id="bbooks" class="bgrid"></div>
        <div id="bchapters" class="cgrid" hidden></div>
      </div>
    </div>

    <div id="bcontent" hidden>
      <div class="card">
        <div class="b-nav">
          <h2 id="btitulo">João 3</h2>
          <button class="s" id="bvoltar">Voltar</button>
        </div>
        <div id="bverses" class="vlist"></div>
      </div>
    </div>
    <p class="msg" style="text-align:center;">Tradução: Almeida (João Ferreira de Almeida)</p>
  </div>
</div>

<div class="sidebar">
  <div id="curiosidade" class="curiosity-card">
    <!-- Preenchido via JS -->
  </div>
</div>
</div>
<script src="shared.js"></script>
<script>
const $=id=>document.getElementById(id);$("lg").src=LOGO;$("plg").src=LOGO;let rows=[];
const n=new Date();let chaves=[];
$("mes").innerHTML=MESES.map((m,i)=>`<option value="${i}">${m}</option>`).join("");
async function iniciar(){
  try{chaves=await (await fetch("/api/escala")).json()||[]}catch(e){chaves=[]}
  const def=chaves.length?chaves[chaves.length-1]:`${n.getFullYear()}-${pad(n.getMonth()+1)}`;
  const [dy,dm]=def.split("-").map(Number);
  const anos=[...new Set([...chaves.map(k=>k.slice(0,4)),String(n.getFullYear()),String(dy)])].sort();
  $("ano").innerHTML=anos.map(a=>`<option value="${a}">${a}</option>`).join("");
  $("ano").value=dy;$("mes").value=dm-1;carregar()}
async function carregar(){const y=+$("ano").value,m=+$("mes").value;$("tb").innerHTML="";$("pdf").hidden=true;
$("ptitulo").textContent=MESES[m].toUpperCase()+"/"+y;renderCal(m,y);$("msg").textContent="Carregando...";
if(!y){$("msg").textContent="";return}
try{const r=await fetch(`/api/escala/${y}-${pad(m+1)}`);rows=await r.json()||[];
if(!rows.length){$("msg").textContent="A escala deste mês ainda não foi publicada.";return}
$("msg").textContent="";$("pdf").hidden=false;
rows.forEach(s=>{const tr=document.createElement("tr");if(s.w===0)tr.className="dom";
if(y===n.getFullYear()&&m===n.getMonth()&&s.d===n.getDate())tr.classList.add("hoje");
const lbs=["Dia","Servos","Data","Início","Término"];[DIAS[s.w],nomeSlot(s)||"—",`${pad(s.d)}/${pad(m+1)}/${y}`,s.i,s.f].forEach((t,i)=>{const td=document.createElement("td");td.textContent=t;td.dataset.l=lbs[i];tr.append(td)});$("tb").append(tr)})}
catch(e){$("msg").textContent="Não foi possível carregar a escala."}}
function renderCal(m,y){const first=new Date(y,m,1).getDay(),nd=new Date(y,m+1,0).getDate();
const hj=(n.getFullYear()===y&&n.getMonth()===m)?n.getDate():0;
let h='<div class="cal-top">'+MESES[m].toUpperCase()+" "+y+"</div><table><thead><tr>";
["D","S","T","Q","Q","S","S"].forEach((d,i)=>h+=`<th${i===0?' class="sun"':""}>${d}</th>`);
h+="</tr></thead><tbody>";
const linhas=Math.ceil((first+nd)/7);
for(let r=0;r<linhas;r++){h+="<tr>";
for(let k=0;k<7;k++){const d=r*7+k-first+1;
if(d<1||d>nd){h+='<td class="off"></td>';continue}
const cls=[k===0?"sun":"",d===hj?"hoje":""].filter(Boolean).join(" ");
h+=`<td${cls?' class="'+cls+'"':""}>${d}</td>`}
h+="</tr>"}
h+="</tbody></table>";$("cal").innerHTML=h}
$("mes").onchange=carregar;$("ano").onchange=carregar;$("pdf").onclick=()=>gerarPdf(+$("ano").value,+$("mes").value,rows);
iniciar();renderCuriosidade();if(typeof initFooter==="function")initFooter();

// ---- Lógica da Bíblia
$("t1").onclick=()=>aba(1);$("t2").onclick=()=>aba(2);
function aba(n){$("p1").hidden=n!==1;$("p2").hidden=n!==2;$("t1").className=n===1?"on":"";$("t2").className=n===2?"on":""}

// ---- Lógica da Bíblia (Holyrics Style)
const BOOKS = [
  {n:"Gênesis",s:"Gn",c:50,t:0},{n:"Êxodo",s:"Ex",c:40,t:0},{n:"Levítico",s:"Lv",c:27,t:0},{n:"Números",s:"Nm",c:36,t:0},{n:"Deuteronômio",s:"Dt",c:34,t:0},
  {n:"Josué",s:"Js",c:24,t:1},{n:"Juízes",s:"Jz",c:21,t:1},{n:"Rute",s:"Rt",c:4,t:1},{n:"1 Samuel",s:"1Sm",c:31,t:1},{n:"2 Samuel",s:"2Sm",c:24,t:1},{n:"1 Reis",s:"1Rs",c:22,t:1},{n:"2 Reis",s:"2Rs",c:25,t:1},{n:"1 Crônicas",s:"1Cr",c:29,t:1},{n:"2 Crônicas",s:"2Cr",c:36,t:1},{n:"Esdras",s:"Ed",c:10,t:1},{n:"Neemias",s:"Ne",c:13,t:1},{n:"Ester",s:"Et",c:10,t:1},
  {n:"Jó",s:"Jó",c:42,t:2},{n:"Salmos",s:"Sl",c:150,t:2},{n:"Provérbios",s:"Pv",c:31,t:2},{n:"Eclesiastes",s:"Ec",c:12,t:2},{n:"Cantares",s:"Ct",c:8,t:2},
  {n:"Isaías",s:"Is",c:66,t:3},{n:"Jeremias",s:"Jr",c:52,t:3},{n:"Lamentações",s:"Lm",c:5,t:3},{n:"Ezequiel",s:"Ez",c:48,t:3},{n:"Daniel",s:"Dn",c:12,t:3},
  {n:"Oseias",s:"Os",c:14,t:4},{n:"Joel",s:"Jl",c:3,t:4},{n:"Amós",s:"Am",c:9,t:4},{n:"Obadias",s:"Ob",c:1,t:4},{n:"Jonas",s:"Jn",c:4,t:4},{n:"Miqueias",s:"Mq",c:7,t:4},{n:"Naum",s:"Na",c:3,t:4},{n:"Habacuque",s:"Hc",c:3,t:4},{n:"Sofonias",s:"Sf",c:3,t:4},{n:"Ageu",s:"Ag",c:2,t:4},{n:"Zacarias",s:"Zc",c:14,t:4},{n:"Malaquias",s:"Ml",c:4,t:4},
  {n:"Mateus",s:"Mt",c:28,t:5},{n:"Marcos",s:"Mc",c:16,t:5},{n:"Lucas",s:"Lc",c:24,t:5},{n:"João",s:"Jo",c:21,t:5},{n:"Atos",s:"At",c:28,t:6},
  {n:"Romanos",s:"Rm",c:16,t:7},{n:"1 Coríntios",s:"1Co",c:16,t:7},{n:"2 Coríntios",s:"2Co",c:13,t:7},{n:"Gálatas",s:"Gl",c:6,t:7},{n:"Efésios",s:"Ef",c:6,t:7},{n:"Filipenses",s:"Fp",c:4,t:7},{n:"Colossenses",s:"Cl",c:4,t:7},{n:"1 Tessalonicenses",s:"1Ts",c:5,t:7},{n:"2 Tessalonicenses",s:"2Ts",c:3,t:7},{n:"1 Timóteo",s:"1Tm",c:6,t:7},{n:"2 Timóteo",s:"2Tm",c:4,t:7},{n:"Tito",s:"Tt",c:3,t:7},{n:"Filemom",s:"Fm",c:1,t:7},
  {n:"Hebreus",s:"Hb",c:13,t:8},{n:"Tiago",s:"Tg",c:5,t:8},{n:"1 Pedro",s:"1Pe",c:5,t:8},{n:"2 Pedro",s:"2Pe",c:3,t:8},{n:"1 João",s:"1Jo",c:5,t:8},{n:"2 João",s:"2Jo",c:1,t:8},{n:"3 João",s:"3Jo",c:1,t:8},{n:"Judas",s:"Jd",c:1,t:8},{n:"Apocalipse",s:"Ap",c:22,t:9}
];

let selBook = null;
// A API espera referências sem acento (ex.: "Genesis", "Salmos")
const semAcento = (s) => String(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "");

function renderBooks(){
  $("bbooks").innerHTML = BOOKS.map((b,i)=>`<button class="cat-${b.t}" onclick="selectBook(${i})">${b.s}<span>${b.n}</span></button>`).join("");
  $("bbooks").hidden = false; $("bchapters").hidden = true; $("bcontent").hidden = true; $("bview").hidden = false;
}

function selectBook(i){
  selBook = BOOKS[i];
  $("bbooks").hidden = true;
  $("bchapters").innerHTML = Array.from({length:selBook.c},(_,k)=>`<button onclick="selectChapter(${k+1})">${k+1}</button>`).join("");
  $("bchapters").hidden = false;
}

// Baixa uma passagem com cache local (funciona offline depois da 1ª consulta)
// e uma nova tentativa automática em caso de falha/limite de requisições.
const chaveCache = (ref) => "biblia:" + semAcento(ref).toLowerCase().replace(/\s+/g, "");
async function textoBiblico(ref){
  const k = chaveCache(ref);
  try { const c = localStorage.getItem(k); if (c) return JSON.parse(c); } catch(e){}
  let erro;
  for (let t = 0; t < 2; t++) {
    try {
      const r = await fetch(`https://bible-api.com/${encodeURIComponent(semAcento(ref))}?translation=almeida`);
      if (r.status === 429) throw new Error("Muitas consultas seguidas. Aguarde alguns segundos e tente novamente.");
      if (!r.ok) throw new Error("Serviço indisponível no momento (" + r.status + ").");
      const j = await r.json();
      if (j.error) throw new Error("Referência não encontrada.");
      if (!j.verses || !j.verses.length) throw new Error("Nenhum versículo encontrado.");
      try { localStorage.setItem(k, JSON.stringify(j)); } catch(e){}
      return j;
    } catch(e) { erro = e; await new Promise(s => setTimeout(s, 900)); }
  }
  throw erro;
}
function mostrarVersos(j){
  $("btitulo").textContent = j.reference || $("btitulo").textContent;
  $("bverses").innerHTML = j.verses.map(v => `<p><b>${v.verse}</b> ${v.text}</p>`).join("");
}
async function carregarPassagem(ref, busca){
  $("btitulo").textContent = busca ? "Busca: " + ref : ref;
  $("bview").hidden = true;
  $("bcontent").hidden = false;
  $("bverses").innerHTML = '<p class="msg">Carregando...</p>';
  try {
    const j = await textoBiblico(ref);
    mostrarVersos(j);
    if (busca) $("bq").value = j.reference || ref;
  } catch(e) {
    $("bverses").innerHTML = `<p class="msg err">${e.message || "Não foi possível carregar."}</p>`;
    const b = document.createElement("button");
    b.className = "s"; b.textContent = "Tentar novamente";
    b.onclick = () => carregarPassagem(ref, busca);
    $("bverses").append(b);
  }
}
function selectChapter(c){ carregarPassagem(`${selBook.n} ${c}`, false); }

$("bvoltar").onclick = ()=>{
  if(!$("bcontent").hidden){ $("bcontent").hidden = true; $("bview").hidden = false; }
  else if(!$("bchapters").hidden){ $("bchapters").hidden = true; $("bbooks").hidden = false; }
};

function buscarBiblia(ref){
  const q = ref || $("bq").value.trim(); if(!q) return;
  carregarPassagem(q, true);
}

$("bbuscar").onclick = ()=>buscarBiblia();
$("brandom").onclick = ()=>{
  const refs=["Joao 3:16","Salmos 23","Genesis 1:1","Mateus 5:1-12","1 Corintios 13","Filipenses 4:13","Josue 1:9","Isaias 41:10","Jeremias 29:11","Salmos 91"];
  buscarBiblia(refs[Math.floor(Math.random()*refs.length)]);
};
$("bq").onkeydown = e=>{if(e.key==="Enter")$("bbuscar").click()};

renderBooks();
</script><script>
// Ao trocar a versão do Service Worker, recarrega uma vez para ficar tudo na mesma versão.
if("serviceWorker" in navigator){
  let recarregou=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(recarregou)return;recarregou=true;location.reload()});
  navigator.serviceWorker.register("/sw.js");
}
</script></body></html>
